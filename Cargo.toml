[package]
name = "arach"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "One launcher for every game on your PC: Steam, Epic, GOG, Xbox, Battle.net and more, plus emulated console games."
repository = "https://github.com/Lappom/arach"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "764fbe9e75ebc91ab94c830181920826fb417be0", default-features = false, features = ["accessibility", "embedded-fonts", "native-file-dialog", "svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
# Already built for Rune; DS/3DS icons and box art are drawn with it.
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Checks an update against the `.sha256` its release carries.
sha2 = "0.10"

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Time", "Win32_System_Power", "Win32_System_Registry", "Win32_Graphics_Gdi"] }
# GOG Galaxy keeps the list of owned games in a SQLite database.
rusqlite = { version = "0.32", features = ["bundled"] }

# Rune patches these four crates; a dependency's [patch] doesn't reach us, so we repeat it.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "764fbe9e75ebc91ab94c830181920826fb417be0" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "764fbe9e75ebc91ab94c830181920826fb417be0" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "764fbe9e75ebc91ab94c830181920826fb417be0" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "764fbe9e75ebc91ab94c830181920826fb417be0" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
