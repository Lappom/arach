# Tests on every push to main and every pull request. On main it also builds the release, so
# the cache it saves is there for the next tag: a tag's run can only restore caches made on
# itself or on the default branch, never another tag's (release.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Same values in release.yml: they're part of the cache key.
env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml picks the toolchain; rustup installs it on first use.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked

  release-cache:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release --locked
